<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="AIGauge">
  <defs>
    <linearGradient id="bg" x1="64" y1="48" x2="448" y2="464" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1b1d36" />
      <stop offset="0.55" stop-color="#17182e" />
      <stop offset="1" stop-color="#111225" />
    </linearGradient>
    <linearGradient id="ring" x1="124" y1="144" x2="394" y2="372" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#13c7a1" />
      <stop offset="1" stop-color="#0e8f72" />
    </linearGradient>
    <linearGradient id="barTop" x1="146" y1="232" x2="376" y2="232" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#18c6a1" />
      <stop offset="1" stop-color="#10a37f" />
    </linearGradient>
    <linearGradient id="barBottom" x1="146" y1="282" x2="328" y2="282" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f2c14a" />
      <stop offset="1" stop-color="#e4a82d" />
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#06080f" flood-opacity="0.42" />
    </filter>
  </defs>

  <rect x="24" y="24" width="464" height="464" rx="126" fill="url(#bg)" />
  <rect x="24.5" y="24.5" width="463" height="463" rx="125.5" fill="none" stroke="#313455" stroke-opacity="0.66" />
  <rect x="44" y="44" width="424" height="424" rx="106" fill="none" stroke="#8086b7" stroke-opacity="0.09" />

  <g filter="url(#softShadow)">
    <circle cx="256" cy="256" r="150" fill="none" stroke="#2a2d48" stroke-width="40" />
    <circle
