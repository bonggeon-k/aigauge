      cy="256"
      r="150"
      fill="none"
      stroke="url(#ring)"
      stroke-width="40"
      stroke-linecap="round"
      stroke-dasharray="620 360"
      transform="rotate(-122 256 256)"
    />
    <circle cx="256" cy="256" r="110" fill="#15172d" />
    <rect x="146" y="218" width="230" height="28" rx="14" fill="url(#barTop)" />
    <rect x="146" y="268" width="182" height="28" rx="14" fill="url(#barBottom)" />
    <rect x="332" y="268" width="44" height="28" rx="14" fill="#3a3d5d" />
    <circle cx="384" cy="282" r="7" fill="#f7cc57" />
