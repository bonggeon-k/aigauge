name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7

      - name: Cache Cargo Registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify IPC capability baseline
        run: node ./scripts/check-capabilities.mjs

      - name: Rust clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Install cargo-audit
        if: matrix.os == 'ubuntu-latest'
        run: cargo install cargo-audit --locked

      - name: Cargo audit
        if: matrix.os == 'ubuntu-latest'
        run: cd src-tauri && cargo audit

      - name: Frontend lint
        run: pnpm lint

      - name: Frontend build
        run: pnpm build

      - name: Accessibility check (manual fallback)
        run: |
          pnpm exec axe --version
          echo "Axe CLI available. E2E page URL required for full run in CI."

      - name: Bundle size check
        run: node -e "const fs=require('fs'); const path=require('path'); const walk=(p)=>fs.existsSync(p)?fs.statSync(p).isDirectory()?fs.readdirSync(p).reduce((n,f)=>n+walk(path.join(p,f)),0):fs.statSync(p).size:0; const bytes=walk('dist'); const mb=Math.round((bytes/1024/1024)*100)/100; console.log('dist size:', mb+'MB'); if(mb>5){console.log('::warning::dist bundle is larger than 5MB')}"

      - name: Rust binary size check
        if: matrix.os == 'ubuntu-latest'
        run: |
          BIN_SIZE=$(stat -c%s src-tauri/target/debug/aigauge || echo 0)
          BIN_SIZE_MB=$((BIN_SIZE / 1024 / 1024))
          echo "binary size: ${BIN_SIZE_MB}MB"
          if [ "$BIN_SIZE_MB" -gt 15 ]; then
            echo "::warning::Rust binary exceeds 15MB"
          fi

      - name: pnpm audit
        if: matrix.os == 'ubuntu-latest'
        run: pnpm audit --audit-level=high
