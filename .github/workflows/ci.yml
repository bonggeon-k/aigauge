name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:

jobs:
  validate:
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify IPC capability baseline
        run: |
          test -f src-tauri/capabilities/default.json
          rg "tauri::command" src-tauri/src -n
          rg "core:default" src-tauri/capabilities/default.json -n

      - name: Rust clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Install cargo-audit
        if: matrix.os == 'ubuntu-latest'
        uses: taiki-e/install-action@cargo-audit

      - name: Cargo audit
        if: matrix.os == 'ubuntu-latest'
        run: cargo audit --manifest-path src-tauri/Cargo.toml

      - name: Frontend lint
        run: pnpm lint

      - name: Frontend build
        run: pnpm build

      - name: Accessibility check (manual fallback)
        run: |
          pnpm add -D @axe-core/cli
          echo "Axe CLI installed. E2E page URL required for full run in CI."

      - name: Bundle size check
        run: |
          DIST_SIZE=$(du -sm dist | cut -f1)
          echo "dist size: ${DIST_SIZE}MB"
          if [ "$DIST_SIZE" -gt 5 ]; then
            echo "::warning::dist bundle is larger than 5MB"
          fi

      - name: Rust binary size check
        if: matrix.os == 'ubuntu-latest'
        run: |
          BIN_SIZE=$(stat -c%s src-tauri/target/debug/aigauge || echo 0)
          BIN_SIZE_MB=$((BIN_SIZE / 1024 / 1024))
          echo "binary size: ${BIN_SIZE_MB}MB"
          if [ "$BIN_SIZE_MB" -gt 15 ]; then
            echo "::warning::Rust binary exceeds 15MB"
          fi

      - name: pnpm audit
        run: pnpm audit --audit-level=high
